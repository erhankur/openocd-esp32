tests_esp32:
  extends: .tests_master_template
  needs:
    - job: build_test_app_esp32
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  variables:
    CHIP_NAME: "esp32"
    TEST_RUN_BOARD_OPTS: "-b esp32-wrover-kit-3.3v -e test_*.*Encrypted"

tests_esp32_flash_encrypted:
  extends: .tests_master_template
  tags:
    - test_jtag_arm_flash_encryption
  needs:
    - job: build_test_app_esp32
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  allow_failure: true
  variables:
    RUNNER_SCRIPT_TIMEOUT: 10m
    CHIP_NAME: "esp32"
    TEST_RUN_BOARD_OPTS: "-b esp32-wrover-kit-3.3v -p test_*.*Encrypted"
  timeout: 15m

tests_esp32s2:
  extends: .tests_master_template
  needs:
    - job: build_test_app_esp32s2
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  variables:
    CHIP_NAME: "esp32s2"
    TEST_RUN_BOARD_OPTS: "-b esp32s2-devkitj -p test_*.*Single"

tests_esp32s2_flash_encrypted:
  extends: .tests_master_template
  tags:
    - test_jtag_arm_flash_encryption_esp32s2
  needs:
    - job: build_test_app_esp32s2
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  variables:
    CHIP_NAME: "esp32s2"
    TEST_RUN_BOARD_OPTS: "-b esp32s2-devkitj -p test_*.*SingleEncrypted"

tests_esp32s3_dual:
  extends: .tests_master_template
  needs:
    - job: build_test_app_esp32s3
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  variables:
    CHIP_NAME: "esp32s3"
    TEST_RUN_BOARD_OPTS: "-b esp32s3-ftdi -p test_*.*Dual"

.tests_esp32s3_dual_usj:
  extends: tests_esp32s3_dual
  tags:
    - esp32s3
    - usb_serial_jtag
  variables:
    TEST_RUN_BOARD_OPTS: "-b esp32s3-builtin -p test_*.*Dual -e test_*.PsramTests* *.*.test_big_binary *.*.test_big_binary_compressed"

tests_esp32s3_single:
  extends: .tests_master_template
  needs:
    - job: build_test_app_esp32s3
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_arm64_test
    - pipeline: $PARENT_PIPELINE_ID
      job: build_linux_armhf_test
    - job: fetch_gcov
    - job: fetch_gdb
      optional: true
  variables:
    CHIP_NAME: "esp32s3"
    OOCD_CMDS: "set ESP_ONLYCPU 1"
    TEST_RUN_BOARD_OPTS: "-b esp32s3-ftdi -p test_*.*Single"

.tests_esp32s3_single_usj:
  extends: tests_esp32s3_single
  tags:
    - esp32s3
    - usb_serial_jtag
  variables:
    TEST_RUN_BOARD_OPTS: "-b esp32s3-builtin -p test_*.*Single -e test_*.PsramTests* *.*.test_big_binary *.*.test_big_binary_compressed"
