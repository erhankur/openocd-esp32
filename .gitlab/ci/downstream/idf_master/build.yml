build_test_app_esp32:
  variables:
    CHIP_NAME: "esp32"
    TOOLCHAIN_PREFIX: "xtensa-esp32"
    TEST_APP_BUILD_TOOLCHAIN_PREFIX: xtensa-esp
  extends: .build_idf_master_test_app_template

build_test_app_esp32s2:
  variables:
    CHIP_NAME: "esp32s2"
    TOOLCHAIN_PREFIX: "xtensa-esp32s2"
    TEST_APP_CONFIGS: "single_core single_core_encrypted svtrace_single apptrace_gcov_single psram_single single_core_amazon_freertos single_core_freertos_list_integrity multi_app_images_single"
    TEST_APP_BUILD_TOOLCHAIN_PREFIX: xtensa-esp
  extends: .build_idf_master_test_app_template

build_test_app_esp32s3:
  variables:
    CHIP_NAME: "esp32s3"
    TOOLCHAIN_PREFIX: "xtensa-esp32s3"
    TEST_APP_CONFIGS: "default svtrace_dual apptrace_gcov_dual psram_dual default_amazon_freertos default_freertos_list_integrity single_core svtrace_single apptrace_gcov_single psram_single single_core_amazon_freertos single_core_freertos_list_integrity multi_app_images_single multi_app_images_dual"
    TEST_APP_BUILD_TOOLCHAIN_PREFIX: xtensa-esp
  extends: .build_idf_master_test_app_template
